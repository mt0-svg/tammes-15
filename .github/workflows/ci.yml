name: D3 pilot

# A pilot of the continuous integration of D3 by kernel check, on the branch d3-pilot only. The chunk jobs are the
# lines of .github/d3-pilot/jobs.tsv. Each chunk job builds the trusted statement modules from the commit's sources,
# exports the closure of its statement and hashes it, then runs Comparator with nanoda alone (4 threads, lean_kernel
# false) on its theorem: Comparator builds the job's generated data and its solution module itself, inside its
# sandbox, and nanoda replays them. The job reference builds the statement closure from source with Mathlib from its
# cache only (no release archive) and hashes it for every job; the job join checks each chunk record against the
# template written from the commit and against that reference. Every step records its wall time, CPU time and memory
# peaks (.github/d3-pilot/measure.sh) in the artifact d3-pilot-<job>. The loader modules of each statement (its codes)
# and the generated data are not in the branch: they come from the draft release named by the required input
# data_release, each checked against the sha256 the commit pins in .github/d3-pilot/ASSETS.sha256 before anything is
# built. Started by hand only.
on:
  workflow_dispatch:
    inputs:
      data_release:
        description: Tag name of the draft release that holds the data tarballs of .github/d3-pilot/ASSETS.sha256 (required; the data is never in the branch)
        required: true

concurrency:
  group: d3-pilot
  cancel-in-progress: false

permissions:
  contents: read

env:
  ROOT: Tammes15

jobs:
  plan:
    name: D3 plan
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: jobs
        run: echo "jobs=$(awk -F'\t' '$1 !~ /^#/ && NF {print $1}' .github/d3-pilot/jobs.tsv | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  chunk:
    name: D3 chunk ${{ matrix.job }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write # a draft release is visible only with write access; this job writes nothing
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JOB: ${{ matrix.job }}
      MEASURE_TSV: ${{ github.workspace }}/verify/measure.tsv
    steps:
      - name: Free disk space (at least 30 GB)
        run: df -h / && test "$(df -B1G --output=avail / | tail -1)" -ge 30
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record the machine
        run: |
          mkdir -p verify
          { echo "commit $GITHUB_SHA job $JOB"; nproc; free -b; df -B1 /; uname -a; } | tee verify/machine.txt
          printf 'step\trc\twall_s\tuser_s\tsys_s\tmax_rss_kb\tscope_peak_bytes\tmachine_used_peak_bytes\n' > "$MEASURE_TSV"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # The loader modules of the statement and the generated data, from the draft release only, each checked against
      # the sha256 the commit pins in .github/d3-pilot/ASSETS.sha256 (the loaders: exactly the modules Jobs/JOB.lean
      # imports) before anything is built.
      - name: Statement loaders and data of the job, checked against ASSETS.sha256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.data_release }}
        run: |
          bash .github/d3-pilot/measure.sh fetch-stmt verify/fetch-stmt.log bash .github/d3-pilot/fetch.sh "$TAG" stmt "$JOB"
          bash .github/d3-pilot/measure.sh fetch-data verify/fetch-data.log bash .github/d3-pilot/fetch.sh "$TAG" data "$JOB"
          cat verify/fetch-stmt.log verify/fetch-data.log

      - uses: actions/checkout@v5
        with:
          repository: leanprover/comparator
          ref: d03acab154d269c06e60e4de7e4cc85deebff94b
          path: .ci/comparator
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Zouuup/landrun
          ref: 811cfff51ceaf3d9843708aa6d22e9b84ccac8b4
          path: .ci/landrun
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build Landrun
        working-directory: .ci/landrun
        run: go build -o landrun cmd/landrun/main.go
      - name: Build nanoda
        run: cargo install --locked --git https://github.com/ammkrn/nanoda_lib --rev 3a2407216ee84a75f9e1aead6803d0578be06ae7 --root "$RUNNER_TEMP/nanoda"

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
      # The main library from the build archive of release v1.3.0 (the release this branch starts from), pinned by its
      # sha256 in .github/d3-pilot/ASSETS.sha256; no other archive and no fallback. Its statement modules are checked
      # against the reference, which builds them from source.
      - name: Build archive of release v1.3.0, pinned
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          a=tammes-15-x86_64-unknown-linux-gnu.tar.gz
          want=$(awk -v f="$a" '$2 == f {print $1}' .github/d3-pilot/ASSETS.sha256)
          [ -n "$want" ] || { echo "no sha256 line for $a in .github/d3-pilot/ASSETS.sha256"; exit 1; }
          gh release download v1.3.0 --pattern "$a" -D "$RUNNER_TEMP"
          got=$(sha256sum < "$RUNNER_TEMP/$a" | cut -d' ' -f1)
          echo "$a: sha256 $got, expected $want"
          [ "$got" = "$want" ] || { echo "sha256 mismatch"; exit 1; }
          bad=$(tar -tvzf "$RUNNER_TEMP/$a" | awk '$1 !~ /^[-d]/ || $NF !~ /^\.\/(lib|ir)(\/|$)/ && $NF != "./"' | wc -l)
          [ "$bad" = 0 ] || { echo "$a: $bad entries not plain files or directories under lib/ and ir/"; exit 1; }
          mkdir -p .lake/build && tar -xzf "$RUNNER_TEMP/$a" -C .lake/build && rm "$RUNNER_TEMP/$a"
          echo "Restored the build of release v1.3.0."

      - name: Patch, align and build Comparator
        run: |
          git -C .ci/comparator apply "$GITHUB_WORKSPACE/.github/comparator-lean-kernel.patch"
          cp lean-toolchain .ci/comparator/lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/comparator
          auto-config: false
          build: true
          build-args: lean4export comparator
          use-mathlib-cache: false
          use-github-cache: false
      - name: Check lean4export commit
        run: test "$(git -C .ci/comparator/.lake/packages/lean4export rev-parse HEAD)" = 076e8e57707e813375e8f9da8bf989799ace9680

      # The challenge module and the config of this job, byte-equal to the template written from jobs.tsv.
      - name: Template
        shell: bash
        run: |
          set -eu
          bash .github/d3-pilot/template.sh "$RUNNER_TEMP/tpl"
          cmp "$RUNNER_TEMP/tpl/Challenge.lean" Tammes15/D3Pilot/Challenge.lean
          cmp "$RUNNER_TEMP/tpl/configs/$JOB.json" ".github/d3-pilot/configs/$JOB.json"
          { echo "challenge $(sha256sum < Tammes15/D3Pilot/Challenge.lean | cut -d' ' -f1)"
            echo "config $(sha256sum < ".github/d3-pilot/configs/$JOB.json" | cut -d' ' -f1)"
            echo "lakefile $(sha256sum < lakefile.toml | cut -d' ' -f1)"
            echo "toolchain $(cat lean-toolchain)"; } | tee verify/template.txt

      # The statement closure, built in this job from the commit's sources (the checker, the chunk statement, the
      # loader definitions of the jobs), then its export and hash. Nothing of the data or the solution is built
      # outside Comparator.
      - name: Build the statement modules and hash the closure of the statement
        shell: bash
        run: |
          set -eu
          bash .github/d3-pilot/measure.sh build-statements verify/build-statements.log lake build Tammes15.D3Pilot.Challenge
          bash .github/d3-pilot/measure.sh hash verify/hash.log bash -c \
            'lake env .ci/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export "$@" > "$RUNNER_TEMP/statement.export"' \
            _ Tammes15.D3Pilot.Challenge -- Tammes15.D3Data.ChunkG Tammes15.D3Data.QXR "Tammes15.D3Pilot.job_$JOB"
          echo "statement_hash $(sha256sum < "$RUNNER_TEMP/statement.export" | cut -d' ' -f1) bytes $(stat -c %s "$RUNNER_TEMP/statement.export")" | tee -a verify/template.txt
          rm -rfv ".lake/build/lib/lean/$ROOT/D3Pilot/Challenge".* ".lake/build/ir/$ROOT/D3Pilot/Challenge".*

      # Comparator builds the challenge and the solution with its data in its sandbox (Lake's own parallelism), exports
      # both and replays the solution's closure in nanoda. Each log line carries the seconds since the start.
      - name: Comparator
        shell: bash
        env:
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.ci/landrun/landrun
          COMPARATOR_LEAN4EXPORT: ${{ github.workspace }}/.ci/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: ${{ runner.temp }}/nanoda/bin/nanoda_bin
        run: |
          set -uo pipefail
          s0=$(date +%s)
          rc=0
          ( m=0; while :; do
              u=$(awk '/^MemTotal:/ {a = $2} /^MemAvailable:/ {b = $2} END {print (a - b) * 1024}' /proc/meminfo)
              [ "$u" -gt "$m" ] && m=$u && echo "$m" > "$RUNNER_TEMP/comparator.sys"; sleep 2; done ) &
          sp=$!
          systemd-run --property=RestrictAddressFamilies=~AF_UNIX --property=MemoryAccounting=yes --user --pty --pipe \
            -E PATH="$PATH" \
            -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
            -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
            -E COMPARATOR_NANODA="$COMPARATOR_NANODA" \
            --working-directory "$PWD" -- \
            /usr/bin/time -o "$RUNNER_TEMP/comparator.time" -f '%e %U %S %M' \
            bash .github/d3-pilot/measure-inner.sh "$RUNNER_TEMP/comparator.peak" \
            lake env .ci/comparator/.lake/build/bin/comparator ".github/d3-pilot/configs/$JOB.json" \
            2>&1 | while IFS= read -r l; do printf '%s %s\n' "$(($(date +%s) - s0))" "$l"; done | tee verify/comparator.log || rc=$?
          kill "$sp" 2> /dev/null
          read -r wall user sys rss < <(tail -n 1 "$RUNNER_TEMP/comparator.time")
          printf 'comparator\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$rc" "$wall" "$user" "$sys" "$rss" "$(cat "$RUNNER_TEMP/comparator.peak")" \
            "$(cat "$RUNNER_TEMP/comparator.sys" 2> /dev/null || echo NA)" >> "$MEASURE_TSV"
          echo "comparator_rc $rc" >> verify/template.txt
          { echo "olean of the data $(find .lake/build/lib/lean/D3E2E -name '*.olean' -printf '%s\n' | paste -sd+ | bc) bytes"
            df -B1 / | tail -1; } >> verify/machine.txt
          exit "$rc"

      - name: Record
        if: always()
        shell: bash
        run: |
          echo "job_wall_s $(($(date +%s) - JOB_START))" >> verify/template.txt
          if grep -qx 'comparator_rc 0' verify/template.txt; then v=PASS; else v=FAIL; fi
          echo "verdict $v" >> verify/template.txt
          cat verify/template.txt; column -t -s $'\t' "$MEASURE_TSV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-pilot-${{ matrix.job }}
          path: verify/
          overwrite: true

  # The reference: the statement closure built from the commit's sources with Mathlib from its cache only, nothing
  # restored from a release or a cache of this repository, and the export of each job's statement.
  reference:
    name: D3 reference
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # a draft release is visible only with write access; this job writes nothing
    env:
      MEASURE_TSV: ${{ github.workspace }}/reference/measure.tsv
    steps:
      - name: Free disk space (at least 30 GB)
        run: df -h / && test "$(df -B1G --output=avail / | tail -1)" -ge 30
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Statement loaders of every job, checked against ASSETS.sha256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.data_release }}
        run: |
          for j in $(awk -F'\t' '$1 !~ /^#/ && NF {print $1}' .github/d3-pilot/jobs.tsv); do
            bash .github/d3-pilot/fetch.sh "$TAG" stmt "$j"
          done
      - uses: actions/checkout@v5
        with:
          repository: leanprover/comparator
          ref: d03acab154d269c06e60e4de7e4cc85deebff94b
          path: .ci/comparator
          persist-credentials: false
      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Align lean4export
        run: |
          cp lean-toolchain .ci/comparator/lean-toolchain
          mkdir -p reference
          printf 'step\trc\twall_s\tuser_s\tsys_s\tmax_rss_kb\tscope_peak_bytes\tmachine_used_peak_bytes\n' > "$MEASURE_TSV"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/comparator
          auto-config: false
          build: true
          build-args: lean4export
          use-mathlib-cache: false
          use-github-cache: false
      - name: Check lean4export commit
        run: test "$(git -C .ci/comparator/.lake/packages/lean4export rev-parse HEAD)" = 076e8e57707e813375e8f9da8bf989799ace9680
      - name: Build the statement closure from source and hash each job's statement
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .lake/build/lib/lean/Tammes15
          bash .github/d3-pilot/measure.sh build-reference reference/build.log lake build Tammes15.D3Pilot.Challenge
          for j in $(awk -F'\t' '$1 !~ /^#/ && NF {print $1}' .github/d3-pilot/jobs.tsv); do
            lake env .ci/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export \
              Tammes15.D3Pilot.Challenge -- Tammes15.D3Data.ChunkG Tammes15.D3Data.QXR "Tammes15.D3Pilot.job_$j" > ref.export
            echo "$j $(sha256sum < ref.export | cut -d' ' -f1) $(stat -c %s ref.export)" | tee -a reference/hashes.txt
          done
          column -t -s $'\t' "$MEASURE_TSV"
      - uses: actions/upload-artifact@v4
        with:
          name: d3-pilot-reference
          path: reference/
          overwrite: true

  join:
    name: D3 join
    needs: [plan, chunk, reference]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: d3-pilot-*
          path: records
      # Coverage from the commit's template: one passing record per line of jobs.tsv, its challenge, config and
      # lakefile equal to the template's, its statement hash equal to the reference's.
      - name: Join
        shell: bash
        env:
          CHUNK_RESULT: ${{ needs.chunk.result }}
          REFERENCE_RESULT: ${{ needs.reference.result }}
        run: |
          set -uo pipefail
          fail=0
          [ "$CHUNK_RESULT" = success ] || { echo "chunk jobs: $CHUNK_RESULT"; fail=1; }
          [ "$REFERENCE_RESULT" = success ] || { echo "reference job: $REFERENCE_RESULT"; fail=1; }
          bash .github/d3-pilot/template.sh "$RUNNER_TEMP/tpl"
          cmp "$RUNNER_TEMP/tpl/Challenge.lean" Tammes15/D3Pilot/Challenge.lean || { echo "challenge module differs from the template"; fail=1; }
          for j in $(awk -F'\t' '$1 !~ /^#/ && NF {print $1}' .github/d3-pilot/jobs.tsv); do
            ref=$(awk -v j="$j" '$1 == j {print $2}' records/d3-pilot-reference/hashes.txt 2> /dev/null)
            r=records/d3-pilot-$j/template.txt
            if [ ! -f "$r" ]; then echo "$j: no record"; fail=1; continue; fi
            if [ -z "$ref" ]; then echo "$j: no reference hash"; fail=1; continue; fi
            ok=1
            grep -qx "challenge $(sha256sum < "$RUNNER_TEMP/tpl/Challenge.lean" | cut -d' ' -f1)" "$r" || { echo "$j: challenge differs from the template"; ok=0; }
            grep -qx "config $(sha256sum < "$RUNNER_TEMP/tpl/configs/$j.json" | cut -d' ' -f1)" "$r" || { echo "$j: config differs from the template"; ok=0; }
            grep -qx "lakefile $(sha256sum < lakefile.toml | cut -d' ' -f1)" "$r" || { echo "$j: lakefile differs"; ok=0; }
            grep -qx "toolchain $(cat lean-toolchain)" "$r" || { echo "$j: toolchain differs"; ok=0; }
            grep -q "^statement_hash $ref " "$r" || { echo "$j: statement hash differs from the reference $ref"; ok=0; }
            grep -qx "verdict PASS" "$r" || { echo "$j: Comparator did not pass"; ok=0; }
            echo "$j: $([ $ok = 1 ] && echo PASS || echo FAIL)"
            [ $ok = 1 ] || fail=1
          done
          [ $fail = 0 ] && echo "JOIN PASS" || { echo "JOIN FAIL"; exit 1; }
