name = "difftest"
version = "0.1.0"
defaultTargets = ["difftest"]

# The computable copy of Prims.lean, read from the package at the root of the repository (it imports only the Lean
# core).
[[lean_lib]]
name = "PrimsQ"
srcDir = "../../../.."
roots = ["Tammes15.Contractors.DiffTest.PrimsQ"]

[[lean_exe]]
name = "difftest"
root = "Main"

[[lean_lib]]
name = "Floats"
roots = ["Floats"]

[[lean_exe]]
name = "soundcheck"
root = "Sound"
