name = "tammes-15"
version = "1.2.0"
description = "The Tammes problem for fifteen points: the maximal minimal distance is arccos u, u the root in (1/2, 7/10) of 13u^5 - u^4 + 6u^3 + 2u^2 - 3u - 1; proved in Lean 4 from two finite computations, the enumeration and the refutation of the graphs, stated as hypotheses"
keywords = ["math", "Tammes problem", "spherical code", "contact graph", "discrete geometry", "formal verification"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/tammes-15"
defaultTargets = ["Statement", "Trigrows", "Local41", "Rattlers", "Glue", "Fans", "Draw", "VendorEM8", "Hyps",
  "Geom", "TwoConn", "Numerics", "FaceChain", "FejesToth", "Attained", "Kappa", "Params", "Nonunique", "PaperSteps",
  "D2Draw", "D2Regions", "Contractors", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The statement of the problem (Theorem 1.1 of the paper).
[[lean_lib]]
name = "Statement"
roots = ["Tammes15.Statement"]

# Real functions of the rows and face relations (Sections 3.4 and 5).
[[lean_lib]]
name = "Trigrows"
globs = ["Tammes15.Trigrows.+"]

# Theorem 4.1, with the rigidity bound D1 as a hypothesis.
[[lean_lib]]
name = "Local41"
globs = ["Tammes15.Local41.+"]

# Lemmas 3.13 and 3.14, Propositions 3.16 and 3.17 by inscribed polygons.
[[lean_lib]]
name = "Rattlers"
globs = ["Tammes15.Rattlers.+"]

# Frames, reconstruction, the enclosure bound, Pair and Local (Section 5.4).
[[lean_lib]]
name = "Glue"
globs = ["Tammes15.Glue.+"]

# Relations (T5), (T6), (T8) and angle additivity.
[[lean_lib]]
name = "Fans"
globs = ["Tammes15.Fans.+"]

# Configurations, contact graphs, rotation systems and Theorem 3.1.
[[lean_lib]]
name = "Draw"
globs = ["Tammes15.Draw.+"]

# The eight-point Lean code of Kryvonos, Liehr and Taylor (arXiv 2609.22077, commit 50d14bc), the modules
# reachable from BestPacking, renamed into Tammes15.Vendor.EM8 (THIRD_PARTY.md). Its sources were written under
# Lean's default options, restored here for this library only.
[[lean_lib]]
name = "VendorEM8"
globs = ["Tammes15.Vendor.EM8.+"]
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }

# The cases, D1 to D4 stated exactly, the interfaces and the main theorem `Tammes15.reduction`.
[[lean_lib]]
name = "Hyps"
globs = ["Tammes15.Hyps.+"]

# Spherical geometry of Section 3 on faces in cone form.
[[lean_lib]]
name = "Geom"
globs = ["Tammes15.Geom.+"]

# Corollary 3.8 by the convex hull (Lemma 3.7).
[[lean_lib]]
name = "TwoConn"
globs = ["Tammes15.TwoConn.+"]

# Certified values of cos, sin, arccos and pi at explicit points.
[[lean_lib]]
name = "Numerics"
globs = ["Tammes15.Numerics.+"]

# Lemmas 3.9 (cone form), 3.11 and 3.12 through the face chain of the eight-point code.
[[lean_lib]]
name = "FaceChain"
globs = ["Tammes15.FaceChain.+"]

# The bound of Fejes Toth in the form d15 <= 56.6716 degrees, by a triangle lemma on the hull of a saturated set
# (Section 8).
[[lean_lib]]
name = "FejesToth"
globs = ["Tammes15.FejesToth.+"]

# D4 for the frames C1 and C3 by exact identities in their field of degree 20 (Proposition 2.1), and the main theorem
# with D1 and D4 proved, `Tammes15.conjecture_of_enum_killed` (Theorem 7.4).
[[lean_lib]]
name = "Attained"
globs = ["Tammes15.Attained.+"]

# D1 for the frames C1 and C3 by the certificate of the proof of Lemma 4.2, checked by kernel reduction.
[[lean_lib]]
name = "Kappa"
globs = ["Tammes15.Kappa.+"]

# The inequalities of code/sage/params_check.sage as Lean theorems; the proof of the main theorem does not use them.
[[lean_lib]]
name = "Params"
globs = ["Tammes15.Params.+"]

# Corollary 1.2 from D2 and D3, `Tammes15.nonunique_of_enum_killed`: the contact graphs of C1 and C3 are not isomorphic.
[[lean_lib]]
name = "Nonunique"
globs = ["Tammes15.Nonunique.+"]

# Section 7.3 in Lean: the steps from the verdicts of the first program to D3 (Propositions 5.6 (2) and 7.7, the
# interval procedures of the program a hypothesis), Theorem 4.1 with its equality case for the eight frame
# configurations, Proposition 2.1 (4) and the last sentence of Corollary 1.2.
[[lean_lib]]
name = "PaperSteps"
globs = ["Tammes15.PaperSteps.+"]

# Contact drawings: the rotation system of a structured configuration is that of a contact drawing, and the
# arcs of distinct edges of a contact drawing are disjoint (Lemma 3.20 (1)).
[[lean_lib]]
name = "D2Draw"
globs = ["Tammes15.D2Draw.+"]

# Lemma 3.20: the regions of a contact drawing with convex faces are the open polygons of its face orbits, and the
# rotation system of a structured configuration is in the class of D2 (Definition 7.1).
[[lean_lib]]
name = "D2Regions"
globs = ["Tammes15.D2Regions.+"]

# Theorem 7.10: the interval procedures of the first program as its source writes them (Definition 5.4), sound for
# every sound arithmetic (Proposition 5.6); D3 from the search trees the replays accept, and the main theorem and
# Corollary 1.2 from D2 and these hypotheses. DiffTest: the commutation theorems of the differential test
# (Section 10.4).
[[lean_lib]]
name = "Contractors"
globs = ["Tammes15.Contractors.+"]

# The statements with `sorry` over copies of the definition modules, which nothing imports, and the module
# that proves them: the pair Comparator checks (config.json).
[[lean_lib]]
name = "Challenge"
globs = ["Tammes15.Challenge.*"]

[[lean_lib]]
name = "Solution"
roots = ["Tammes15.Solution"]
