name = "tammes-15"
version = "1.3.0"
description = "The Tammes problem for fifteen points: the maximal minimal distance is arccos u, u the root in (1/2, 7/10) of 13u^5 - u^4 + 6u^3 + 2u^2 - 3u - 1; proved in Lean 4 from two finite computations, the enumeration and the refutation of the graphs, stated as hypotheses"
keywords = ["math", "Tammes problem", "spherical code", "contact graph", "discrete geometry", "formal verification"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/tammes-15"
defaultTargets = ["Statement", "Trigrows", "Local41", "Rattlers", "Glue", "Fans", "Draw", "VendorEM8", "Hyps",
  "Geom", "TwoConn", "Numerics", "FaceChain", "FejesToth", "Attained", "Kappa", "Params", "Nonunique", "PaperSteps",
  "D2Draw", "D2Regions", "Contractors", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The statement of the problem.
[[lean_lib]]
name = "Statement"
roots = ["Tammes15.Statement"]

# Real functions of the rows and of the face relations.
[[lean_lib]]
name = "Trigrows"
globs = ["Tammes15.Trigrows.+"]

# The local optimality, with the rigidity bound D1 as a hypothesis.
[[lean_lib]]
name = "Local41"
globs = ["Tammes15.Local41.+"]

# The rattlers and the hexagons, by inscribed polygons.
[[lean_lib]]
name = "Rattlers"
globs = ["Tammes15.Rattlers.+"]

# Frames, reconstruction, the enclosure bound, Pair and Local.
[[lean_lib]]
name = "Glue"
globs = ["Tammes15.Glue.+"]

# Relations (T5), (T6), (T8) and angle additivity.
[[lean_lib]]
name = "Fans"
globs = ["Tammes15.Fans.+"]

# Configurations, contact graphs, rotation systems and the structure theorem.
[[lean_lib]]
name = "Draw"
globs = ["Tammes15.Draw.+"]

# The eight-point Lean code of Kryvonos, Liehr and Taylor (arXiv 2609.22077, commit 50d14bc), the modules
# reachable from BestPacking, renamed into Tammes15.Vendor.EM8 (THIRD_PARTY.md). Its sources were written under
# Lean's default options, restored here for this library only.
[[lean_lib]]
name = "VendorEM8"
globs = ["Tammes15.Vendor.EM8.+"]
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }

# The cases, D1 to D4 stated exactly, the interfaces and the main theorem `Tammes15.reduction`.
[[lean_lib]]
name = "Hyps"
globs = ["Tammes15.Hyps.+"]

# Spherical geometry of the faces in cone form.
[[lean_lib]]
name = "Geom"
globs = ["Tammes15.Geom.+"]

# The 3-connectivity of the contact graph, by the convex hull.
[[lean_lib]]
name = "TwoConn"
globs = ["Tammes15.TwoConn.+"]

# Certified values of cos, sin, arccos and pi at explicit points.
[[lean_lib]]
name = "Numerics"
globs = ["Tammes15.Numerics.+"]

# The faces of the contact graph, through the face chain of the eight-point code.
[[lean_lib]]
name = "FaceChain"
globs = ["Tammes15.FaceChain.+"]

# The bound of Fejes Toth in the form d15 <= 56.6716 degrees, by a triangle lemma on the hull of a saturated set.
[[lean_lib]]
name = "FejesToth"
globs = ["Tammes15.FejesToth.+"]

# D4 for the frames C1 and C3 by exact identities in their field of degree 20, and the main theorem with D1 and D4
# proved, `Tammes15.conjecture_of_enum_killed`.
[[lean_lib]]
name = "Attained"
globs = ["Tammes15.Attained.+"]

# D1 for the frames C1 and C3 by a certificate checked by kernel reduction.
[[lean_lib]]
name = "Kappa"
globs = ["Tammes15.Kappa.+"]

# Inequalities on the constants and the parameters of the program.
[[lean_lib]]
name = "Params"
globs = ["Tammes15.Params.+"]

# The non-uniqueness from D2 and D3, `Tammes15.nonunique_of_enum_killed`: the contact graphs of C1 and C3 are not
# isomorphic.
[[lean_lib]]
name = "Nonunique"
globs = ["Tammes15.Nonunique.+"]

# The steps from the verdicts of the program to D3, the interval procedures and their search trees, the local
# optimality with its equality case for the eight frame configurations, and the frames not isometric.
[[lean_lib]]
name = "PaperSteps"
globs = ["Tammes15.PaperSteps.+"]

# Contact drawings: the rotation system of a structured configuration is that of a contact drawing, and the
# arcs of distinct edges of a contact drawing are disjoint.
[[lean_lib]]
name = "D2Draw"
globs = ["Tammes15.D2Draw.+"]

# The regions of a contact drawing with convex faces are the open polygons of its face orbits, and the rotation
# system of a structured configuration is in the class of D2.
[[lean_lib]]
name = "D2Regions"
globs = ["Tammes15.D2Regions.+"]

# The formal model of the procedures of the program, sound for every sound arithmetic; D3 from the search trees
# the replays accept, and the main theorem and the non-uniqueness from D2 and these hypotheses.
[[lean_lib]]
name = "Contractors"
globs = ["Tammes15.Contractors.+"]

# The statements with `sorry` over copies of the definition modules, which nothing imports, and the module
# that proves them: the pair Comparator checks (config.json).
[[lean_lib]]
name = "Challenge"
globs = ["Tammes15.Challenge.*"]

[[lean_lib]]
name = "Solution"
roots = ["Tammes15.Solution"]

# D3 by kernel check (branch d3-pilot): the walk over stored records, the checkers of its record kinds with their
# programs and soundness, and the chunk statement (.d3-pilot-modules.txt lists the modules added).
[[lean_lib]]
name = "D3"
globs = ["Tammes15.D3lp.+", "Tammes15.D3Kernel.+", "Tammes15.D3Pack.+", "Tammes15.D3Ck2.+", "Tammes15.D3Prog.+",
  "Tammes15.D3Trig.+", "Tammes15.D3Data.+", "Tammes15.W1Filter.+"]

# The chunk jobs of the pilot: the loader definitions of their codes and their statements (Jobs, Challenge), and
# the proof of each job from its data (<job>.Solution).
[[lean_lib]]
name = "D3Pilot"
globs = ["Tammes15.D3Pilot.+"]

# The generated data of the jobs (the walk modules and the per-code facts of each piece), unpacked from the job's
# tarball by .github/d3-pilot/fetch.sh.
[[lean_lib]]
name = "D3PilotData"
globs = ["D3E2E.+"]
leanOptions = { Elab.async = false }
