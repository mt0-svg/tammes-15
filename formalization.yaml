# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Tammes problem for fifteen points"
  description: >-
    The largest possible minimal angular distance between fifteen points on the
    unit sphere is arccos u, about 53.65785 degrees, where u is the root in
    (1/2, 7/10) of 13u^5 - u^4 + 6u^3 + 2u^2 - 3u - 1. Up to isometry this value
    is attained by exactly two configurations, described by Buddenhagen and
    Kottwitz, whose contact graphs are not isomorphic. Lean 4 with Mathlib proves
    every step except the enumeration of the plane graphs and their refutation
    by the program, which enter the formal proof as hypotheses.
  authors:
    - "mt0-svg"
  responsible_maintainers:
    - "mt0-svg"
  license: "Apache-2.0"

classification:
  arxiv: ["math.MG", "math.CO"]
  msc2020: ["52C17", "05C10", "52C25", "65G30"]

sources:
  - title: "The Tammes problem for fifteen points (the paper of this repository)"
    authors:
      - "mt0-svg"
    id: "https://doi.org/10.5281/zenodo.23058956"
    type: original-proof
    location: "paper/main.tex, Theorem 1.1, Corollary 1.2, Theorem 1.3 and Proposition 3.2; the PDF of each GitHub release and the Zenodo record"
    relationship: other
    note: >-
      The results are proved in the paper of this repository, whose TeX
      source is paper/main.tex, and in this formalization. The argument of
      Theorem 1.3 is due to Satvik-patil, who posted it as issue 1 of this
      repository (https://github.com/mt0-svg/tammes-15/issues/1).
    contributors:
      - name: "Satvik-patil"
        role: "the argument of Theorem 1.3"
  - title: "The Tammes problem for sixteen points: a computer-assisted proof candidate"
    authors:
      - "K. Kępiński"
    id: "doi:10.5281/zenodo.23312437"
    type: preprint
    location: "Remark 2"
    relationship: other
    note: >-
      States the first sentence of Theorem 1.3, and that no maximal
      configuration has a point at distance more than arccos u from all the
      others, on paper and from the computations of an earlier version of
      the paper of this repository.
    author_endorsement: not-contacted
  - title: "Multiplicity and symmetry breaking in (conjectured) densest packings of congruent circles on a sphere"
    authors:
      - "J. Buddenhagen"
      - "D. A. Kottwitz"
    id: "https://web.archive.org/web/20210507001707/http://www.buddenbooks.com/jb/pack/sphere/toggles7.pdf"
    type: preprint
    location: "Sections 4 and 7"
    relationship: background
    note: >-
      Describes the two configurations C1 and C3 that the main theorem shows
      optimal, with the frame from which both are built.
    author_endorsement: not-contacted
  - title: "Extremal problems of circle packings on a sphere and irreducible contact graphs"
    authors:
      - "O. R. Musin"
      - "A. S. Tarasov"
    id: "doi:10.1134/S0081543815010095; arXiv:1410.0744"
    type: article
    location: "Proc. Steklov Inst. Math. 288 (2015), 117-131, Section 6, Questions 1 and 2"
    relationship: background
    note: >-
      Corollary 1.2 of the paper answers Question 2 in the negative for N = 15.
      The reduction to plane graphs follows their proofs for N = 13 and 14.
    author_endorsement: not-contacted

related_formalizations:
  - id: "https://github.com/lukasliehr/Energy-Minimization-8-Points/tree/50d14bc06bd41f61573eb6a36eedb8d00759af8f"
    relationship: builds-on
    note: >-
