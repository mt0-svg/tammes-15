status:
  scope: >-
    Formalized: the value of d_15 (Theorem 1.1 of the paper), Corollary 1.2
    and Theorem 1.3, each in two forms. The first form
    (`conjecture_of_enum_progTreesDom`, `nonunique_of_enum_progTreesDom`,
    `classification_of_enum_progTreesDom`,
    `classification_count_of_enum_progTreesDom`) assumes D2, `EnumComplete L`:
    every rotation system with 12 to 15 vertices of a 3-connected graph with
    degrees 3 to 5, in the input class of plantri read on a drawing, is
    isomorphic, possibly reversing the orientation, to a member of `L`; a
    family `N` of interval procedures with `Impl N`: on every box of the
    domain, each narrowing of `N` is the outcome of a run of the primitive
    steps defined in `Tammes15/Contractors/Prims.lean`, computed with some
    sound arithmetic, and each enclosure contains the triangle angle of the
    primitive steps; and `ProgTreesDom L N`: every case of `L` has, for every
    choice of hexagons, a choice in the same faces with accepted trees from
    boxes of the domain that contain the root boxes, on ranges of d that cover
    [d_lo, d_hi]. The second form (`conjecture_of_enum_killed`,
    `nonunique_of_enum_killed`, `classification_of_enum_killed`,
    `classification_count_of_enum_killed`) assumes D2 and D3,
    `Killed L {frameC1, frameC3}`. Proposition 3.2 of the paper (the
    automorphisms of the two contact graphs and the orthogonal maps that
    preserve C1 and C3), a step of the proof of Theorem 1.3, is proved with
    no hypothesis. Not formalized: the hypotheses themselves, which rest on
    the enumeration by plantri with an output filter and on the program,
    whose certificates are replayed (code/, Section 9.6 of the paper: plantri
    meets its description, the filter keeps exactly the graphs of maximum
    degree at most 5, and the program meets its model in the sense of
    Definition B.1(6) of the paper).
