        - "Tammes15.PaperSteps.Classes"
      note: "for fifteen labelled unit vectors at pairwise angle at least $\\arccos u$, up to relabelling: the first sentence as the image of $C_1$ or $C_3$ under a linear isometry of $\\mathbb{R}^3$ (first and second declarations); the classes up to rotation, with the rotations as the linear isometries of determinant $1$, as the third and fourth: every such configuration is $sRC_1$ or $sRC_3$ with $s=\\pm1$ and $R$ a rotation, each of $\\pm C_1$, $\\pm C_3$ is one, and no rotation maps one of the four onto another; with Corollary 1.2 this gives the two classes up to isometry; the last sentence, with distance $\\psi^*$ as angle $\\arccos u$, also as the third and fourth, which add that the contact graph at $u$ is isomorphic to that of $C_1$ or of $C_3$ and that these two are not isomorphic; the first and third declarations from the hypotheses of Theorem B.9, the second and fourth from D2 and D3 (Definitions 7.1 and 7.3)"
