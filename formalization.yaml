automation:
  methods:
    - method: agent
      models: []
      framework: "not named in this repository"
      tool_setup: >-
        AI-generated research: the results, proofs and code (the paper, the
        certificate program and the Lean formalization) were found and written
        by AI. Lean 4 and Mathlib for the formal proof; Comparator with nanoda
        for the check of the statements; plantri, Rust, SageMath and PARI/GP
        for the computations.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "one Linux x86_64 workstation; GitHub-hosted runners for the checks"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    The paper's own statement, repeated in the README: "This is AI-generated
    research: the results, proofs and code were found and written by AI.
    Credit goes to all the humans whose work it builds on."

fidelity:
  divergences: >-
    The challenge states the results for labelled unit vectors of R^3 with
    angular distance InnerProductGeometry.angle; Theorem 1.3 is stated for
    fifteen vectors at pairwise angle at least arccos u, which by the main
    theorem is the same as minimal distance arccos u; its first sentence
    concludes with an image of C1 or C3 under a linear isometry after
    relabelling, and its count up to rotation takes the rotations as the
    linear isometries of determinant 1 and adds that the contact graph is
    isomorphic to that of C1 or of C3. Corollary
    1.2 does not name the two configurations; its proof takes C1 and C3, and
    its last sentence is proved separately for them. The points of C1 and C3
    in the challenge are polynomial expressions in u and in a root b of a
    polynomial over Q(u), each pinned down by an enclosure
    (Tammes15/Attained/Data.lean).

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    No human expert has reviewed the proof. Fresh AI referee passes checked the
    mathematics, the Lean statements against the paper, the computations and
    the paper. Mechanically: the Lean build, #print axioms on every main
    theorem, an environment audit of every constant of the package, and
    Comparator with nanoda on the export.

alignment:
  namespace: "Tammes15"
  statements:
    # statement-map begin: generated by code/paper/statement_map.pl, do not edit
    - source: "Theorem 1.1 of the paper (thm:main)"
      status: proved
      lean:
        - "Tammes15.conjecture_of_enum_progTreesDom"
        - "Tammes15.conjecture_of_enum_killed"
      module:
        - "Tammes15.Contractors.Statement"
        - "Tammes15.Attained.Final"
      script:
        - "code/gp/paper_checks.gp"
      output:
        - "code/gp/paper_checks.out"
      note: "the equality $d_{15}=\\psi^*$ as `Tammes15.Conjecture`, from the hypotheses of Theorem B.9: D2 (Definition 7.1), the accepted trees of the program and procedures computed by the program (Definition B.1(5)); the second declaration from D2 and D3 (Definitions 7.1 and 7.3); the formal statement does not name $C_1$ and $C_3$"
    - source: "Corollary 1.2 of the paper (cor:nonunique)"
      status: proved
      lean:
        - "Tammes15.nonunique_of_enum_progTreesDom"
        - "Tammes15.nonunique_of_enum_killed"
        - "Tammes15.Nonunique.frames_not_iso"
        - "Tammes15.PaperSteps.frames_not_isometric"
        - "Tammes15.PaperSteps.frames_not_distance_preserving"
      module:
        - "Tammes15.Contractors.Main"
        - "Tammes15.Nonunique.Corollary"
        - "Tammes15.PaperSteps.Isometric"
      script:
        - "code/gp/contact_graphs.gp"
        - "code/lean-data/gen_seplt.sh"
      output:
        - "code/gp/contact_graphs.out"
        - "code/lean-data/gen_seplt.out"
      note: "the first sentence from the hypotheses of Theorem B.9, and from D2 and D3 (Definitions 7.1 and 7.3) as the second declaration: the maximum $d$ is attained by two configurations whose contact graphs at $\\cos d$ are not isomorphic; the statement does not name them, and its proof takes $C_1$ and $C_3$; the non-isomorphism of the contact graphs of $C_1$ and $C_3$ at $u$ is the third declaration, with no hypothesis; the last sentence is the fourth and fifth, with no hypothesis: no isometry of $\\mathbb{R}^3$ maps $C_1$ onto $C_3$, and no bijection between their points preserves distances"
    - source: "Theorem 1.3 of the paper (thm:classif)"
      status: proved
      lean:
        - "Tammes15.classification_of_enum_progTreesDom"
        - "Tammes15.classification_of_enum_killed"
